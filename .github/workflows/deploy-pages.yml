name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v4

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 패키지 설치
        run: npm ci

      - name: Pages 경로 설정
        id: pages-path
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          if [ "$repository" = "$owner.github.io" ]; then
            echo "base_path=" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/$repository" >> "$GITHUB_OUTPUT"
          fi

      - name: 정적 사이트 빌드
        run: npm run build:pages
        env:
          GITHUB_PAGES: 'true'
          GITHUB_PAGES_BASE_PATH: ${{ steps.pages-path.outputs.base_path }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages-path.outputs.base_path }}

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 배포 파일 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
